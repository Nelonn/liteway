name: Build and publish docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            dockerfile: docker/litewayd.Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - suffix: ""
            dockerfile: docker/litewayd.Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - suffix: "-cert"
            dockerfile: docker/liteway-cert.Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - suffix: "-cert"
            dockerfile: docker/liteway-cert.Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}"
          echo "name=${IMG,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  publish-manifest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          for img in "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cert"; do
            img="${img,,}"

            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              docker buildx imagetools create \
                -t "${img}:nightly" \
                "${img}:amd64-${{ github.sha }}" \
                "${img}:arm64-${{ github.sha }}"
            fi

            if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
              docker buildx imagetools create \
                -t "${img}:${{ github.ref_name }}" \
                "${img}:amd64-${{ github.sha }}" \
                "${img}:arm64-${{ github.sha }}"

              docker buildx imagetools create \
                -t "${img}:latest" \
                "${img}:amd64-${{ github.sha }}" \
                "${img}:arm64-${{ github.sha }}"
            fi
          done
